<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인/비밀번호찾기</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/find_id.css">
</head>
<body>
  <header>
        <h1 class="hidden">부동산 중개 사이트</h1>
        <nav id="navbar">
            <div class="nav-menu">
                <a href="index.html" class="logo">승진부동산</a>
                <ul>
                    <li><a href="comdpany.html">회사소개</a></li>
                    <li><a href="product.html">매물찾기</a></li>
                    <li><a href="contactus.html">문의하기</a></li>
                    <li><a href="login.html">로그인</a></li>
                    <li><a href="blurb.html">중개사무소 광고문의</a></li>
                </ul>
            </div>
        </nav>
    </header>
  <div class="find-container">
    <h2>아이디 찾기/ 비밀번호 재설정</h2>
    <div class="tab-buttons">
      <button id="find-id-btn" class="active">아이디 찾기</button>
      <button id="find-pw-btn">비밀번호 찾기</button>
    </div>

    <!-- 아이디 찾기 폼 -->
    <div id="id-form" class="form-section active">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="이메일 입력">
      </div>
      <button class="submit-btn">아이디 찾기</button>
    </div>

    <!-- 비밀번호 찾기 폼 -->
    <div id="pw-form" class="form-section">
      <div class="form-group">
        <label for="userid">아이디</label>
        <input type="text" id="userid" placeholder="아이디 입력">
      </div>
      <div class="form-group">
        <label for="email2">이메일</label>
        <input type="email" id="email2" placeholder="이메일 입력">
      </div>
      <button class="submit-btn">비밀번호 재설정</button>
    </div>
    <!-- 로그인 -->
    <div class="login_link">
      <p>계정을 찾으셨나요? <a href="login.html">로그인</a></p>
    </div>
  </div>
</body>
</html>
